# Smoke test: 1 world, 1 seed, 1 policy (llm_summary exercises compaction).
# Run full_context with -T config=configs/smoke_full.yaml afterwards.
model_notes: "QuantTrio/Qwen3.6-35B-A3B-AWQ (4-bit AWQ of Qwen/Qwen3.6-35B-A3B), vLLM 0.33.0 in WSL2, served as qwen3.6-35b-a3b-awq, non-thinking"
world_seeds: [0]
agent_seed_offset: 0
policies: [llm_summary]
world:
  n_steps: 40
  interim_step: 10
  compaction_steps: [15, 28]
  final_step: 40
  recoverable: false
agent:
  temperature: 0.6
  top_p: 0.95
  max_tokens: 2048
  interim_max_tokens: 2048
  final_max_tokens: 8192
  forced_retry_max_tokens: 16384
  enable_thinking: false
  probe_interval: 5
  active_probe: true
  probe_max_tokens: 200
  probe_concurrency: 16
  summary_budget_tokens: 1000
  keep_last_steps: 2

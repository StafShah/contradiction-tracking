[project]
name = "contradiction-tracking"
version = "0.1.0"
description = "Tracking contradictions through long-horizon LLM agent tasks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "inspect-ai>=0.3.288",
    "lifelines>=0.30.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "worlds", "probes", "scoring", "tasks", "analysis"]
